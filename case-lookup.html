<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Case Lookup</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      background-color: #f5f5f5;
      padding: 10px;
    }
    h2 {
      color: #003366;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    input[type="text"] {
      padding: 4px 6px;
      width: 200px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
    }
    button {
      padding: 4px 12px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }
    button:hover { background-color: #0055aa; }
    #result {
      margin-top: 8px;
      padding: 8px;
      background-color: white;
      border: 1px solid #ddd;
      border-radius: 4px;
      display: none;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <h2>Case Lookup</h2>
  <div class="row">
    <input type="text" id="caseInput" placeholder="Enter Case ID..." />
    <button onclick="lookupCase()">Search</button>
  </div>
  <div id="result">
    <p><strong>Case ID:</strong> <span id="displayCaseId"></span></p>
    <p><strong>Status:</strong> Demo result — no backend connected yet</p>
    <p><strong>Note:</strong> This is a test mashup for Atea.</p>
  </div>
  <script>
    function lookupCase() {
      var caseId = document.getElementById('caseInput').value.trim();
      if (!caseId) { alert('Please enter a Case ID.'); return; }
      document.getElementById('displayCaseId').innerText = caseId;
      document.getElementById('result').style.display = 'block';
    }
  </script>
</body>
</html>
